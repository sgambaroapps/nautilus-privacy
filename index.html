<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nautilus DiveKit — Informativa sulla privacy</title>
<style>
  :root{
    --fondo:#ffffff; --testo:#1a1a1a; --tenue:#5a6570;
    --blu:#0b3c5d; --azzurro:#1b7aa6; --riquadro:#e8f4f9; --bordo:#d5e3ea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --fondo:#12191f; --testo:#e8eef2; --tenue:#9fb0bd;
      --blu:#8fc7e0; --azzurro:#5fb0d4; --riquadro:#16262f; --bordo:#2a3b47;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:0; background:var(--fondo); color:var(--testo);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{max-width:760px; margin:0 auto; padding:32px 20px 72px}
  header{border-bottom:2px solid var(--bordo); padding-bottom:20px; margin-bottom:28px}
  h1{color:var(--blu); font-size:1.7rem; margin:0 0 6px}
  .sub{color:var(--tenue); font-size:.95rem; margin:0}
  h2{color:var(--azzurro); font-size:1.15rem; margin:32px 0 10px}
  p,li{margin:0 0 12px}
  ul{padding-left:22px}
  a{color:var(--azzurro)}
  .sintesi{
    background:var(--riquadro); border-left:4px solid var(--azzurro);
    padding:16px 18px; border-radius:0 8px 8px 0; margin:20px 0 8px;
  }
  .sintesi p{margin:0}
  nav{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 0}
  nav button{
    font:inherit; font-size:.9rem; cursor:pointer; padding:6px 14px;
    border:1px solid var(--bordo); background:transparent; color:var(--tenue);
    border-radius:999px;
  }
  nav button:hover{border-color:var(--azzurro); color:var(--azzurro)}
  nav button[aria-current="true"]{
    background:var(--azzurro); border-color:var(--azzurro); color:#fff; font-weight:600;
  }
  footer{margin-top:44px; padding-top:18px; border-top:1px solid var(--bordo);
    color:var(--tenue); font-size:.88rem}
</style>
</head>

  <footer id="pie"></footer>
</div>

const ORDINE = ["it","en","es","fr","de","pt"];

function mostra(codice){
  const t = T[codice];
  document.documentElement.lang = codice;
  document.title = "Nautilus DiveKit — " + t.titolo;
  document.getElementById("sottotitolo").textContent = t.titolo;

  let html = '<div class="sintesi"><p>' + t.sintesi + '</p></div>';
  t.sezioni.forEach(function(s, i){
    html += "<h2>" + (i + 1) + ". " + s[0] + "</h2>";
    html += s[1].trim().startsWith("<ul") ? s[1] : "<p>" + s[1] + "</p>";
  });
  document.getElementById("contenuto").innerHTML = html;
  document.getElementById("pie").textContent = t.aggiornato + ": " + AGGIORNATO;

  document.querySelectorAll("#lingue button").forEach(function(b){
    b.setAttribute("aria-current", b.dataset.lang === codice ? "true" : "false");
  });
  try { history.replaceState(null, "", "#" + codice); } catch (e) { /* file:// */ }
}

const nav = document.getElementById("lingue");
ORDINE.forEach(function(c){
  const b = document.createElement("button");
  b.textContent = T[c].nome;
  b.dataset.lang = c;
  b.onclick = function(){ mostra(c); };
  nav.appendChild(b);
});

// Lingua iniziale: quella chiesta nell'indirizzo, altrimenti quella del
// browser se la conosciamo, altrimenti inglese.
const daUrl = location.hash.replace("#", "");
const daBrowser = (navigator.language || "en").slice(0, 2).toLowerCase();
mostra(T[daUrl] ? daUrl : (T[daBrowser] ? daBrowser : "en"));
